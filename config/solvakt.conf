# Solvakt - konfiguration
# Format: nyckel = värde. Rader som börjar med # är kommentarer.
# Nycklar som saknas får standardvärdet som står inom parentes.

# ── Server ───────────────────────────────────────────────────────────
# Unix domain socket som klienten ansluter till (/tmp/solvakt.sock)
socket_path = /tmp/solvakt.sock

# Loggfil; tomt värde loggar bara till stderr (logs/solvakt.log)
log_file = logs/solvakt.log

# Lägsta nivå som loggas: debug, info, warn eller error (info)
log_level = info

# ── Plats och elområde ───────────────────────────────────────────────
# Koordinater för väderprognosen, decimalgrader (Stockholm)
latitude  = 59.3293
longitude = 18.0686

# Elområde för spotpriser: SE1, SE2, SE3 eller SE4 (SE3)
price_region = SE3

# ── Anläggning ───────────────────────────────────────────────────────
# Solpanelernas yta i kvadratmeter (20)
panel_area_m2 = 20

# Panelernas verkningsgrad, 0-1 (0.18)
panel_efficiency = 0.18

# Hushållets genomsnittliga förbrukning i kW (1.0)
base_load_kw = 1.0

# Batteriets kapacitet i kWh; 0 betyder inget batteri (10)
battery_capacity_kwh = 10

# Högsta laddnings- och urladdningseffekt i kW (3)
battery_max_kw = 3

# ── Hämtning och cache ───────────────────────────────────────────────
# Hur ofta ny data hämtas, sekunder (900 = var 15:e minut)
fetch_interval_s = 900

# Hur länge en beräknad plan är giltig i cachen, sekunder (1800)
cache_ttl_s = 1800

# Timeout för ett HTTP-anrop i fetchern, sekunder (10)
http_timeout_s = 10

# Bas-URL:er för de externa API:erna
weather_api_url = https://api.open-meteo.com/v1/forecast
price_api_url   = https://www.elprisetjustnu.se/api/v1/prices
